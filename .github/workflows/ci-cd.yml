name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docker-php-updated]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILDKIT: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated images match templates
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.1", "8.2", "8.3", "8.4"]
        type: ["", "-prod"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export to Docker (nginx)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}-nginx${{ matrix.type }}
          load: true
          pull: true
          tags: kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }}

      - name: Test docker images PHP executable
        run: |
          docker run kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }} php -v
          docker run kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }} wp --allow-root --version
          docker run kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }} nginx -v
          docker run kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }} nginx -T
          docker run kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }} supervisord --version

      - name: Test docker images wordpress code
        run: |
          docker run kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }} php /kool/wordpress/index.php

      - name: Login to DockerHub
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-wordpress'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push (nginx)
        uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-wordpress'
        with:
          context: ${{ matrix.version }}-nginx${{ matrix.type }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: kooldev/wordpress:${{ matrix.version }}-nginx${{ matrix.type }}
