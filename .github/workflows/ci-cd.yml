name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docker-php-updated]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Check generated contexts
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code
      - id: tags
        run: echo "tags=$(jq -c '[.builds[].name]' fwd-template.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: ["8.1", "8.2", "8.3", "8.4"]
        type: ["", "-prod"]
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      VARIANT: ${{ matrix.version }}-nginx${{ matrix.type }}
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: kool-dev/kool/.github/actions/image-build@e06584d9fc7de69f4e3a9811d64a9f691f592b6b
        with:
          arch: ${{ env.ARCH }}
      - name: Build fresh image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.VARIANT }}
          load: true
          pull: true
          provenance: false
          platforms: linux/${{ env.ARCH }}
          tags: kooldev/wordpress:${{ env.VARIANT }}
      - name: Test exact image ID
        env:
          IMAGE: ${{ steps.image.outputs.imageid }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/$ARCH"
          docker run --rm "$IMAGE" uname -m | grep -Ex "$(uname -m)"
          docker run --rm "$IMAGE" php -v
          docker run --rm "$IMAGE" wp --allow-root --version
          docker run --rm "$IMAGE" nginx -v
          docker run --rm "$IMAGE" nginx -T
          docker run --rm "$IMAGE" supervisord --version
          docker run --rm "$IMAGE" php /kool/wordpress/index.php
      - uses: kool-dev/kool/.github/actions/image-stage@e06584d9fc7de69f4e3a9811d64a9f691f592b6b
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-wordpress'
        with:
          canonical-repository: kool-dev/docker-wordpress
          default-branch: master
          repository: kooldev/wordpress
          arch: ${{ env.ARCH }}
          group: ${{ env.VARIANT }}
          images: '[{"tag":"${{ env.VARIANT }}","id":"${{ steps.image.outputs.imageid }}"}]'
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  publish:
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-wordpress'
    uses: kool-dev/kool/.github/workflows/image-publish.yml@e06584d9fc7de69f4e3a9811d64a9f691f592b6b
    with:
      canonical-repository: kool-dev/docker-wordpress
      default-branch: master
      repository: kooldev/wordpress
      tags: ${{ needs.checks.outputs.tags }}
      tooling-ref: e06584d9fc7de69f4e3a9811d64a9f691f592b6b
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
