name: Resume publication

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Latest CI/CD run with every native build/test/staging job successful
        required: true
        type: string
      source_attempt:
        description: Completed attempt containing the complete release metadata
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: CI/CD-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-wordpress'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Authorize the complete source attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: python3 .github/scripts/recover.py "$SOURCE_RUN" "$SOURCE_ATTEMPT"
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: wordpress-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}-*
          path: metadata
      - name: Validate complete source metadata
        run: |
          GITHUB_RUN_ID="$SOURCE_RUN_ID" GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" python3 .github/scripts/publish.py preflight
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Republish all manifests from tested digests (no builds or staging)
        run: |
          GITHUB_RUN_ID="$SOURCE_RUN_ID" GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" python3 .github/scripts/publish.py publish
